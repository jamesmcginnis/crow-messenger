send_message:
  fields:
    to:
      required: true
      example: '["person1", "person2"]'
      selector:
        object:
    message:
      required: true
      example: "Someone is at the front door"
      selector:
        text:
          multiline: true
    attachment:
      required: false
      example: "/config/www/snapshots/doorbell.jpg"
      selector:
        text:
    group_name:
      required: false
      example: "Family"
      selector:
        text:
    actions:
      required: false
      example: '["Unlock", "Ignore"]'
      selector:
        object:
post:
  fields:
    message:
      required: true
      example: "The washing's done"
      selector:
        text:
          multiline: true
    attachment:
      required: false
      example: "/local/snapshots/doorbell.jpg"
      selector:
        object:
    to:
      required: false
      example: '["person1", "person2"]'
      selector:
        object:
    group:
      required: false
      example: "Parents"
      selector:
        text:
    background:
      required: false
      example: "sunset"
      selector:
        select:
          options: ["accent", "sunset", "ocean", "forest", "berry", "night", "rose", "gold"]
